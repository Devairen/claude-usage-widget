# Builds the Windows tray app on GitHub's Windows machines, so nobody needs
# Rust installed locally. Download the result from the run's "Artifacts" box.
name: Build Windows app

on:
  push:
    branches: [main]
    paths: ["windows-app/**", ".github/workflows/windows-app.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: windows-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows-app/src-tauri
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: claude-usage-windows
          path: |
            windows-app/src-tauri/target/release/claude-usage.exe
            windows-app/src-tauri/target/release/bundle/nsis/*.exe
            windows-app/src-tauri/target/release/bundle/msi/*.msi
